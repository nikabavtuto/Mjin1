<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style3.css">
</head>

<body>
  <div class="container">
    <div class="form-section">
      <h1>Get Started Now</h1>

      <form id="login-form">
        <div class="input-group">
          <label>Name</label>
          <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>Name</label>
            <a href="#" class="forgot-link">forgot password</a>
          </div>
          <input type="password" placeholder="Enter your name" required>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div class="divider">
        <span>Or</span>
      </div>

      <div class="social-grid">
        <button class="btn-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="">
          Sign in with Google
        </button>
        <button class="btn-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="">
          Sign in with Apple
        </button>
      </div>

      <p class="footer-text">Don't have an account? <a href="#">Sign Up</a></p>
    </div>

    <div class="image-section">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1614594975525-e45190c55d0b?q=80&w=1000&auto=format&fit=crop"
          alt="Monstera">
      </div>
    </div>
  </div>
</body>

</html>
